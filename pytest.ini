# T2, the integration's tests (INTEGRATION_PLAN.md 7.1): pytest + pytest-homeassistant-custom-component, Python >= 3.14.
#   <venv>/bin/python -m pytest tests/integration
# The core's tests (tests/core) are a unittest suite: «python3 -I -B tests/core/run.py» (tests/core/requirements.txt).
[pytest]
testpaths = tests/integration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 120
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
